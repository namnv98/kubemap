spring.application.name=kubemap
server.port=8080
# only reachable from this machine: the UI can change the cluster with your kubeconfig credentials
server.address=127.0.0.1
# stop at once: the open connections are endless streams (live graph SSE, logs, terminals, tunnels), graceful draining
# would only wait for its 30 s timeout
server.shutdown=immediate
# fabric8 logs a line for every alpha/beta CRD version it informs on
logging.level.io.fabric8.kubernetes.client.dsl.internal.VersionUsageUtils=ERROR
# regexes; namespaces matching any of them are treated as "system" (collapsed, listed last)
k8s-studio.system-namespaces=^kube-.*,^cert-manager$,^ingress-nginx$,^monitoring$,^logging$,.*-system$,^istio.*,^linkerd.*,^argocd$,^cattle-.*,^local-path-storage$,^tigera-operator$,^calico-.*,^metallb.*,^velero$,^kyverno$,^external-dns$,^traefik$
# set to false for a read-only Kubemap (hides and blocks scale/restart/delete/edit)
k8s-studio.write.enabled=true
# kubeconfigs imported from the UI (cluster picker) are saved here, with the chosen context; git-ignored (credentials)
k8s-studio.kubeconfig-dir=config/kubeconfigs
# also offer the contexts of ~/.kube/config ($KUBECONFIG) in the picker
k8s-studio.include-default-kubeconfig=true
# remote access to port-forwards: a separate port serving only the HTTP proxy (/pf/…) and the TCP tunnel (/tunnel/…),
# each guarded by the forward's secret token. 0 = off. The UI stays on server.address; put this one on 0.0.0.0 to let
# other machines in, ideally behind a TLS reverse proxy (then set public-url to the address clients use).
k8s-studio.remote.port=8091
k8s-studio.remote.address=127.0.0.1
k8s-studio.remote.public-url=
# optional login (off: the UI is only on 127.0.0.1). users = name:bcrypt-hash:role (admin | viewer), comma separated;
# hash with: java -jar kubemap.jar hash-password
k8s-studio.auth.enabled=true
k8s-studio.auth.users=admin:$2a$10$h2YSFatm2Y.S6xrBAC4aZud4ZQXx8YE70R4zaN2TgO81zkA9z8.G2:admin
server.servlet.session.timeout=12h
server.servlet.session.cookie.same-site=lax

# smaller transfers: gzip static files and JSON (SSE is left out: the default mime types don't include text/event-stream)
server.compression.enabled=true
server.compression.min-response-size=2048
# static files: the browser keeps them and asks again each time (304 when unchanged) instead of downloading ~600 KB per reload
spring.web.resources.cache.cachecontrol.no-cache=true
