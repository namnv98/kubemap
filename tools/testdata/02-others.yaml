# shop-staging: smaller copy of the shop api (canary), NodePort service
apiVersion: v1
kind: Namespace
metadata: { name: shop-staging, labels: { team: commerce, env: staging } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: api, namespace: shop-staging, labels: { app: api } }
spec:
  replicas: 1
  selector: { matchLabels: { app: api } }
  template:
    metadata: { labels: { app: api, version: v2 } }
    spec:
      containers:
        - name: api
          image: hashicorp/http-echo:1.0
          args: ["-listen=:8080", "-text=shop-api v2 (staging)"]
          ports: [{ name: http, containerPort: 8080 }]
          resources: { requests: { cpu: 10m, memory: 16Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: api, namespace: shop-staging }
spec:
  type: NodePort
  selector: { app: api }
  ports: [{ name: http, port: 8080, targetPort: http, nodePort: 30080 }]
---
# blog: nginx + mariadb, Recreate strategy, emptyDir cache
apiVersion: v1
kind: Namespace
metadata: { name: blog, labels: { team: content, env: prod } }
---
apiVersion: v1
kind: Secret
metadata: { name: mariadb, namespace: blog }
stringData: { MARIADB_ROOT_PASSWORD: root-test-only, MARIADB_PASSWORD: blog-test-only }
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: mariadb, namespace: blog }
spec:
  serviceName: mariadb
  replicas: 1
  selector: { matchLabels: { app: mariadb } }
  template:
    metadata: { labels: { app: mariadb } }
    spec:
      containers:
        - name: mariadb
          image: mariadb:11.4
          env:
            - { name: MARIADB_DATABASE, value: blog }
            - { name: MARIADB_USER, value: blog }
          envFrom: [{ secretRef: { name: mariadb } }]
          ports: [{ name: mysql, containerPort: 3306 }]
          resources: { requests: { cpu: 50m, memory: 160Mi }, limits: { memory: 400Mi } }
          volumeMounts: [{ name: data, mountPath: /var/lib/mysql }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 2Gi } } }
---
apiVersion: v1
kind: Service
metadata: { name: mariadb, namespace: blog }
spec:
  clusterIP: None
  selector: { app: mariadb }
  ports: [{ port: 3306 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: web, namespace: blog, labels: { app: web } }
spec:
  replicas: 2
  strategy: { type: Recreate }
  selector: { matchLabels: { app: web } }
  template:
    metadata: { labels: { app: web } }
    spec:
      initContainers:
        - name: wait-db
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z mariadb 3306; do echo waiting for db; sleep 2; done"]
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{ containerPort: 80 }]
          resources: { requests: { cpu: 10m, memory: 24Mi } }
          volumeMounts: [{ name: cache, mountPath: /var/cache/nginx }]
      volumes:
        - name: cache
          emptyDir: { sizeLimit: 256Mi }
---
apiVersion: v1
kind: Service
metadata: { name: web, namespace: blog }
spec:
  selector: { app: web }
  ports: [{ port: 80 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: blog, namespace: blog }
spec:
  ingressClassName: traefik
  rules:
    - host: blog.example.test
      http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: web, port: { number: 80 } } } }] }
---
# observability: node-exporter DaemonSet on every node (incl. master), prometheus, RBAC
apiVersion: v1
kind: Namespace
metadata: { name: observability, labels: { team: platform } }
---
apiVersion: apps/v1
kind: DaemonSet
metadata: { name: node-exporter, namespace: observability, labels: { app: node-exporter } }
spec:
  selector: { matchLabels: { app: node-exporter } }
  template:
    metadata: { labels: { app: node-exporter } }
    spec:
      hostNetwork: true
      hostPID: true
      tolerations: [{ operator: Exists }]
      containers:
        - name: node-exporter
          image: prom/node-exporter:v1.8.2
          args: ["--path.rootfs=/host"]
          ports: [{ name: metrics, containerPort: 9100 }]
          resources: { requests: { cpu: 10m, memory: 24Mi }, limits: { memory: 64Mi } }
          volumeMounts: [{ name: root, mountPath: /host, readOnly: true }]
      volumes:
        - name: root
          hostPath: { path: / }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: prometheus, namespace: observability }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: prometheus-read }
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/metrics, services, endpoints, pods]
    verbs: [get, list, watch]
  - nonResourceURLs: [/metrics]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: prometheus-read }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: prometheus-read }
subjects: [{ kind: ServiceAccount, name: prometheus, namespace: observability }]
---
apiVersion: v1
kind: ConfigMap
metadata: { name: prometheus, namespace: observability }
data:
  prometheus.yml: |
    global: { scrape_interval: 30s }
    scrape_configs:
      - job_name: node
        kubernetes_sd_configs: [{ role: node }]
        relabel_configs:
          - source_labels: [__address__]
            regex: '(.*):10250'
            replacement: '${1}:9100'
            target_label: __address__
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: prometheus, namespace: observability, labels: { app: prometheus } }
spec:
  replicas: 1
  selector: { matchLabels: { app: prometheus } }
  template:
    metadata: { labels: { app: prometheus } }
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          args: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=6h"]
          ports: [{ name: web, containerPort: 9090 }]
          resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 512Mi } }
          readinessProbe: { httpGet: { path: /-/ready, port: web } }
          volumeMounts: [{ name: config, mountPath: /etc/prometheus }]
      volumes:
        - name: config
          configMap: { name: prometheus }
---
apiVersion: v1
kind: Service
metadata: { name: prometheus, namespace: observability }
spec:
  selector: { app: prometheus }
  ports: [{ name: web, port: 9090, targetPort: web }]
---
# batch: CronJobs (one suspended), a finished Job and a failing Job
apiVersion: v1
kind: Namespace
metadata: { name: batch, labels: { team: data } }
---
apiVersion: batch/v1
kind: CronJob
metadata: { name: report, namespace: batch }
spec:
  schedule: "*/5 * * * *"
  timeZone: Asia/Ho_Chi_Minh
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: report
              image: busybox:1.36
              command: ["sh", "-c", "echo generating report; sleep 10; echo done"]
              resources: { requests: { cpu: 5m, memory: 8Mi } }
---
apiVersion: batch/v1
kind: CronJob
metadata: { name: cleanup, namespace: batch }
spec:
  schedule: "0 3 * * *"
  suspend: true
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers: [{ name: cleanup, image: busybox:1.36, command: ["sh", "-c", "echo cleanup"] }]
---
apiVersion: batch/v1
kind: Job
metadata: { name: migrate-v42, namespace: batch }
spec:
  completions: 3
  parallelism: 2
  template:
    spec:
      restartPolicy: Never
      containers: [{ name: migrate, image: busybox:1.36, command: ["sh", "-c", "echo migrating; sleep 5"] }]
---
apiVersion: batch/v1
kind: Job
metadata: { name: import-broken, namespace: batch }
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers: [{ name: import, image: busybox:1.36, command: ["sh", "-c", "echo 'cannot open input.csv' >&2; exit 3"] }]
---
# messaging: 3-node NATS cluster, headless service, PDB, anti-affinity across nodes
apiVersion: v1
kind: Namespace
metadata: { name: messaging, labels: { team: platform } }
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: nats, namespace: messaging }
spec:
  serviceName: nats
  replicas: 3
  podManagementPolicy: Parallel
  selector: { matchLabels: { app: nats } }
  template:
    metadata: { labels: { app: nats } }
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm: { topologyKey: kubernetes.io/hostname, labelSelector: { matchLabels: { app: nats } } }
      containers:
        - name: nats
          image: nats:2.10-alpine
          args: ["--cluster_name", "demo", "--cluster", "nats://0.0.0.0:6222", "--http_port", "8222",
                 "--routes", "nats://nats-0.nats:6222,nats://nats-1.nats:6222,nats://nats-2.nats:6222"]
          ports:
            - { name: client, containerPort: 4222 }
            - { name: cluster, containerPort: 6222 }
            - { name: monitor, containerPort: 8222 }
          resources: { requests: { cpu: 10m, memory: 16Mi }, limits: { memory: 128Mi } }
          readinessProbe: { httpGet: { path: /healthz, port: monitor } }
---
apiVersion: v1
kind: Service
metadata: { name: nats, namespace: messaging }
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: { app: nats }
  ports: [{ name: client, port: 4222 }, { name: cluster, port: 6222 }, { name: monitor, port: 8222 }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: nats, namespace: messaging }
spec:
  maxUnavailable: 1
  selector: { matchLabels: { app: nats } }
---
# auth: whoami service behind ingress with TLS reference, namespaced Role/RoleBinding, ExternalName
apiVersion: v1
kind: Namespace
metadata: { name: auth, labels: { team: security } }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: auth-operator, namespace: auth }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: secret-reader, namespace: auth }
rules:
  - apiGroups: [""]
    resources: [secrets, configmaps]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [whoami]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: auth-operator-secret-reader, namespace: auth }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: secret-reader }
subjects:
  - { kind: ServiceAccount, name: auth-operator, namespace: auth }
  - { kind: User, name: alice@example.test, apiGroup: rbac.authorization.k8s.io }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: whoami, namespace: auth }
spec:
  replicas: 2
  selector: { matchLabels: { app: whoami } }
  template:
    metadata: { labels: { app: whoami } }
    spec:
      serviceAccountName: auth-operator
      containers:
        - name: whoami
          image: traefik/whoami:v1.10
          ports: [{ name: http, containerPort: 80 }]
          resources: { requests: { cpu: 5m, memory: 8Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: whoami, namespace: auth }
spec:
  selector: { app: whoami }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: v1
kind: Service
metadata: { name: identity-provider, namespace: auth }
spec:
  type: ExternalName
  externalName: login.example.test
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: whoami, namespace: auth }
spec:
  ingressClassName: traefik
  tls: [{ hosts: [auth.example.test], secretName: auth-tls }]
  rules:
    - host: auth.example.test
      http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: whoami, port: { name: http } } } }] }
---
# payments: deliberately broken workloads to show error / warning states
apiVersion: v1
kind: Namespace
metadata: { name: payments, labels: { team: payments, env: prod } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: gateway, namespace: payments }
spec:
  replicas: 2
  selector: { matchLabels: { app: gateway } }
  template:
    metadata: { labels: { app: gateway } }
    spec:
      containers:
        - name: gateway
          image: registry.example.test/payments/gateway:1.4.2   # does not exist -> ImagePullBackOff
          resources: { requests: { cpu: 10m, memory: 16Mi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: ledger, namespace: payments }
spec:
  replicas: 1
  selector: { matchLabels: { app: ledger } }
  template:
    metadata: { labels: { app: ledger } }
    spec:
      containers:
        - name: ledger
          image: busybox:1.36
          command: ["sh", "-c", "echo 'FATAL: LEDGER_KEY not set' >&2; exit 1"]   # CrashLoopBackOff
          resources: { requests: { cpu: 5m, memory: 8Mi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: fraud-model, namespace: payments }
spec:
  replicas: 1
  selector: { matchLabels: { app: fraud-model } }
  template:
    metadata: { labels: { app: fraud-model } }
    spec:
      containers:
        - name: model
          image: nginx:1.27-alpine
          resources: { requests: { cpu: "8", memory: 32Gi } }   # never fits -> Pending (Insufficient cpu/memory)
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: notifier, namespace: payments }
spec:
  replicas: 1
  selector: { matchLabels: { app: notifier } }
  template:
    metadata: { labels: { app: notifier } }
    spec:
      containers:
        - name: notifier
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          envFrom: [{ configMapRef: { name: notifier-config } }]   # missing ConfigMap -> CreateContainerConfigError
---
apiVersion: v1
kind: Service
metadata: { name: gateway, namespace: payments }
spec:
  selector: { app: gateway }
  ports: [{ port: 443, targetPort: 8443 }]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: archive, namespace: payments }
spec:
  storageClassName: fast-ssd     # no such StorageClass -> Pending PVC
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 5Gi } }
